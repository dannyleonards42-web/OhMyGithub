name: Ubuntu full test suite

on:
  push:
    branches:
      - main
      - ci/ubuntu-full-test-suite
  pull_request:
    branches:
      - main
      - diagnostics/attempt-safe-openrouter-fallback

permissions:
  contents: read

concurrency:
  group: ubuntu-full-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install live-files test dependencies
        run: npm ci --prefix scripts/live-files --no-audit --no-fund

      - name: Run all repository tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 30m node --test scripts/*.test.mjs
